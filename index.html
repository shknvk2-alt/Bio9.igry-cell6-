<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аркадний портал</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff0844, #ffb199);
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
        }
        h1 { 
            margin-bottom: 5px; 
            font-size: 3rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        p.subtitle { 
            color: #fff; 
            font-size: 1.2rem;
            margin-bottom: 30px; 
            text-shadow: 1px 1px 5px rgba(0,0,0,0.2);
        }
        
        .user-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 30px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .user-box label {
            font-weight: bold;
            font-size: 1.1rem;
        }
        input {
            padding: 12px 18px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            outline: none;
            width: 240px;
            text-align: center;
            margin-top: 10px;
            background: #ffffff;
            color: #333;
            font-weight: bold;
        }

        .games-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .game-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
        }
        .game-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
        }
        .game-card h3 { 
            margin-top: 0; 
            color: #fff; 
            font-size: 1.5rem;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
        }
        .game-card a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #00f2fe;
            color: #1a1a1a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.2s;
        }
        .game-card a:hover { 
            background: #4facfe; 
            color: white;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>🎮 Аркадний Портал</h1>
    <p class="subtitle">Введи своє ім'я, обирай гру та змагайся за лідерство!</p>

    <div class="user-box">
        <label for="playerName">Твоє ім'я (нікнейм):</label><br>
        <input type="text" id="playerName" placeholder="Введи нік...">
    </div>

    <!-- Сітка з 6 іграми (дві додаси пізніше) -->
    <div class="games-container">
        <div class="game-card">
            <h3>🐍 Гра 1</h3>
            <a href="game1.html" onclick="saveName()">Грати</a>
        </div>
        <div class="game-card">
            <h3>🧱 Гра 2</h3>
            <a href="game2.html" onclick="saveName()">Грати</a>
        </div>
        <div class="game-card">
            <h3>⚡ Гра 3</h3>
            <a href="game3.html" onclick="saveName()">Грати</a>
        </div>
        <div class="game-card">
            <h3>🔢 Гра 4</h3>
            <a href="game4.html" onclick="saveName()">Грати</a>
        </div>
        <div class="game-card">
            <h3>❌ Гра 5</h3>
            <a href="game5.html" onclick="saveName()">Грати</a>
        </div>
        <div class="game-card">
            <h3>🧠 Гра 6</h3>
            <a href="game6.html" onclick="saveName()">Грати</a>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedName = localStorage.getItem("playerName");
            if (savedName) document.getElementById('playerName').value = savedName;
        };

        function saveName() {
            const nameInput = document.getElementById('playerName'].value.trim();
            localStorage.setItem("playerName", nameInput || "Гість");
        }
    </script>

</body>
</html>
